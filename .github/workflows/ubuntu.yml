name: Ubuntu

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]

    env:
      APKTOOL_VERSION: "2.7.0"
      BUILD_TOOLS_VERSION: "33.0.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;${BUILD_TOOLS_VERSION}"
          yes | sdkmanager --licenses || true

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt

      - name: Install Apktool
        run: |
          sudo curl -L \
            "https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_${APKTOOL_VERSION}.jar" \
            -o /usr/local/bin/apktool.jar

          sudo curl -L \
            "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" \
            -o /usr/local/bin/apktool

          sudo chmod +x /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool.jar

          apktool --version

      - name: Install BundleDecompiler
        run: |
          sudo curl -L \
            "https://raw.githubusercontent.com/TamilanPeriyasamy/BundleDecompiler/master/build/libs/BundleDecompiler-0.0.2.jar" \
            -o /usr/local/bin/BundleDecompiler.jar

          sudo chmod +x /usr/local/bin/BundleDecompiler.jar

          test -s /usr/local/bin/BundleDecompiler.jar

      - name: Verify Android tools
        run: |
          java -version
          python --version
          adb version
          ls -lh /usr/local/bin/apktool*
          ls -lh /usr/local/bin/BundleDecompiler.jar

      - name: Run tests
        run: |
          export PATH="${PATH}:${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          pytest --verbose --cov=./ --cov-report=xml

      - name: Upload tests coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false

  publish:
    if: >
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    needs: test
    name: Push updated version to Docker Hub
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: debaxyz
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: debaxyz/obfuscapk
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          
